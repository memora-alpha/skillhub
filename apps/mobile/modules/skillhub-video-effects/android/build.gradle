plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.skillhub.mobile'
version = '1.0.0'

android {
  namespace 'expo.modules.skillhubvideo'
  defaultConfig { minSdkVersion 24 }
}

def lockedClasspaths = [
  'debugCompileClasspath', 'debugRuntimeClasspath',
  'releaseCompileClasspath', 'releaseRuntimeClasspath'
]
configurations.configureEach {
  if (name in lockedClasspaths) resolutionStrategy.activateDependencyLocking()
}

dependencies {
  implementation 'com.facebook.react:react-android'
  implementation project(':livekit_react-native-webrtc')
  implementation 'com.google.mlkit:segmentation-selfie:16.0.0-beta6'
}
