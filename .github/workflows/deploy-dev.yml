name: Deploy API Dev

on:
  push:
    branches: [dev]
    paths:
      - services/api/**
      - packages/**
      - scripts/cd/**
      - .github/workflows/**
      - .dockerignore
      - .npmrc
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skillhub-api-dev-deploy
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == 'refs/heads/dev'
    uses: ./.github/workflows/api-checks.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
      - name: Request Coolify deployment after checks
        env:
          COOLIFY_API_WEBHOOK: ${{ secrets.COOLIFY_API_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: node scripts/cd/deploy-dev.mjs
